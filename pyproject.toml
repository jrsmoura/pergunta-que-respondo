[project]
name = "agent_app"
version = "0.1.0"
description = "Projeto de chatbot para responder sobre educação no Distrito Federal"
authors = [
    {name = "ToledoSnows",email = "felipe.toledo.neves@gmail.com"}
]

requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=5.2.5,<6.0.0)",
    "langgraph (>=0.6.4,<0.7.0)",
    "langchain (>=0.3.27,<0.4.0)",
    "langchain-openai (>=0.3.30,<0.4.0)",
    "tavily-python (>=0.7.10,<0.8.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "langchain-community (>=0.3.27,<0.4.0)"
]

packages = [
    { include = "agent_app" },
    { include = "core" },
    { include = "CRAWLER" },
    { include = "FAISS" }
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
