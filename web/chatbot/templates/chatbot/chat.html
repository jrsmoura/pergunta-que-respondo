<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Pergunta que Respondo</title>

  <!-- Bootstrap 4.3 -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <style>
    /* ---------- Paleta ---------- */
    :root{
      --bg:#000020;        /* fundo */
      --bg2:#171a4a;       /* camada 2 */
      --surface:#2f2c79;   /* cartões */
      --accent:#bd0003;    /* primary */
      --accent-2:#ff0000;  /* hover/active */
      --text:#f8f9fc;
    }

    body{
      color:var(--text);
      background:
        radial-gradient(1200px 800px at 100% -10%, var(--bg2), transparent 60%),
        linear-gradient(180deg, var(--bg), #060616 60%);
    }

    .chat-wrapper{max-width:900px; margin:3rem auto;}
    .card{
      background: linear-gradient(180deg, rgba(47,44,121,.65), rgba(23,26,74,.75));
      border:1px solid rgba(255,255,255,.08);
      color:#f1f3f9;
    }

    .message{line-height:1.5}
    .message.me{background:rgba(255,0,0,.06)}
    .message.bot{background:rgba(189,0,3,.20)}
    .message .badge-role{background:var(--accent)}

    .input-group .form-control{
      background:var(--surface); color:#fff;
      border:1px solid rgba(255,0,0,.35);
    }
    .input-group .form-control::placeholder{color:#cfd0ff}
    .btn-ask{
      background:linear-gradient(90deg,var(--accent),var(--accent-2));
      border:none; color:#fff;
    }
    .btn-ask:hover{filter:brightness(1.1)}

    /* Fontes extras */
    .message .fontes {
      font-size: 0.85em;
      color: #cfd0ff;
      margin-top: 6px;
    }
    .message .fontes ul {
      margin: 5px 0 0 15px;
      padding: 0;
    }
    .message .fontes li { margin-bottom: 4px; }

    #loading {
      display: none;
      font-style: italic;
      color: #ccc;
      text-align: center;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="chat-wrapper">
    <h1 class="mb-3">Pergunta que Respondo</h1>

    <div class="card shadow-lg rounded-3 mb-4">
      <div class="card-body" id="chat-log" style="max-height:55vh; overflow:auto;">
        <p class="text-muted">Faça sua primeira pergunta abaixo.</p>
      </div>
    </div>

    <p id="loading">💭 Processando sua pergunta...</p>

    <form id="chat-form" class="input-group">
      <input name="message" type="text" id="pergunta"
             class="form-control form-control-lg"
             placeholder="Digite sua pergunta..." autocomplete="off" required>
      <div class="input-group-append">
        <button class="btn btn-ask btn-lg px-4" type="submit">Perguntar</button>
      </div>
      <div class="input-group-append">
        <button class="btn btn-secondary btn-lg px-4" type="button" id="clear">Limpar</button>
      </div>
    </form>
  </div>

  <!-- Dependências -->
  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    const log = document.getElementById('chat-log');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('pergunta');
    const loading = document.getElementById('loading');
    const clearBtn = document.getElementById('clear');

    function appendMessage(role, text, fontes=[]) {
      const div = document.createElement('div');
      div.className = `mb-3 message ${role} p-3 rounded`;
      const roleLabel = role === 'me' ? 'Você' : 'Bot';
      div.innerHTML = `<span class="badge badge-role mr-2">${roleLabel}</span> ${marked.parse(text)}`;

      if (role === 'bot' && Array.isArray(fontes) && fontes.length > 0) {
        const fontesDiv = document.createElement("div");
        fontesDiv.classList.add("fontes");
        let html = "<b>Fontes:</b><ul>";
        for (const f of fontes) {
          html += `<li><i>${f.fonte}</i>: ${f.snippet}</li>`;
        }
        html += "</ul>";
        fontesDiv.innerHTML = html;
        div.appendChild(fontesDiv);
      }

      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    form.addEventListener('submit', async function(e){
      e.preventDefault();
      const msg = input.value.trim();
      if(!msg) return;
      appendMessage('me', msg);
      input.value = '';

      loading.style.display = 'block';

      try{
        const resp = await fetch('/ask/', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ pergunta: msg })
        });

        const data = await resp.json();
        loading.style.display = 'none';
        if (data.resposta) {
          appendMessage('bot', data.resposta, data.fontes || []);
        } else {
          appendMessage('bot', '❌ Erro ao obter resposta.');
        }
      }catch(err){
        loading.style.display = 'none';
        appendMessage('bot', '❌ Falha: ' + err);
      }
    });

    clearBtn.addEventListener("click", () => {
      log.innerHTML = "";
    });
  </script>
</body>
</html>
